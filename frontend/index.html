<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe Management System — Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Cafe Management System</h1>
    <p class="subtitle">Menu Management</p>
    <nav class="site-nav" aria-label="Sections">
      <a href="index.html" aria-current="page">Menu</a>
      <a href="orders.html">New order</a>
    </nav>
  </header>

  <main>
    <section class="card" aria-labelledby="form-heading">
      <h2 id="form-heading">Add Menu Item</h2>
      <p id="editing-note" class="hint" hidden></p>

      <!-- Status messages are announced to screen readers as they appear. -->
      <div id="form-status" class="status" role="status" aria-live="polite" hidden></div>

      <form id="menu-item-form" novalidate>
        <div class="field">
          <label for="item-name">Item name <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="item-name"
            name="name"
            maxlength="100"
            autocomplete="off"
            required
            aria-required="true"
            aria-describedby="item-name-hint item-name-error">
          <p id="item-name-hint" class="hint">For example: Cappuccino</p>
          <p id="item-name-error" class="error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="item-category">Category <span class="required" aria-hidden="true">*</span></label>
          <select
            id="item-category"
            name="category"
            required
            aria-required="true"
            aria-describedby="item-category-error">
            <option value="">Select a category</option>
            <option value="Beverages">Beverages</option>
            <option value="Food">Food</option>
            <option value="Desserts">Desserts</option>
            <option value="Snacks">Snacks</option>
          </select>
          <p id="item-category-error" class="error" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="item-price">Price <span class="required" aria-hidden="true">*</span></label>
          <div class="input-prefix">
            <span class="prefix" aria-hidden="true">₹</span>
            <input
              type="number"
              id="item-price"
              name="price"
              min="0.01"
              step="0.01"
              inputmode="decimal"
              required
              aria-required="true"
              aria-describedby="item-price-hint item-price-error">
          </div>
          <p id="item-price-hint" class="hint">Amount in rupees, up to two decimal places</p>
          <p id="item-price-error" class="error" role="alert" hidden></p>
        </div>

        <div class="actions">
          <button type="submit" id="submit-button">Add item</button>
          <button type="reset" id="reset-button" class="secondary">Clear</button>
          <button type="button" id="cancel-edit-button" class="secondary" hidden>
            Cancel edit
          </button>
        </div>
      </form>
    </section>

    <section class="card" aria-labelledby="list-heading">
      <h2 id="list-heading">Menu items</h2>

      <div id="list-status" class="status" role="status" aria-live="polite" hidden></div>

      <table id="menu-table" hidden>
        <caption class="visually-hidden">Saved menu items</caption>
        <thead>
          <tr>
            <th scope="col">Item</th>
            <th scope="col">Category</th>
            <th scope="col" class="numeric">Price</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="menu-table-body"></tbody>
      </table>
    </section>
  </main>

  <!-- Deletion is irreversible, so it goes through a confirmation step.
       A native <dialog> is used so focus trapping and Escape come free. -->
  <dialog id="confirm-delete" aria-labelledby="confirm-delete-heading">
    <h2 id="confirm-delete-heading">Delete menu item</h2>
    <p id="confirm-delete-message"></p>
    <form method="dialog" class="actions">
      <!-- Cancel comes first so it takes focus when the dialog opens;
           the destructive choice should never be the default. -->
      <button type="submit" value="cancel" class="secondary">Cancel</button>
      <button type="submit" value="delete" class="destructive">Delete</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
